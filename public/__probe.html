<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#333;display:flex;gap:16px;padding:16px;font-family:system-ui}
figure{margin:0}figcaption{color:#fff;font:600 12px system-ui;padding:4px 0}
iframe{border:0;background:#fff;display:block}
</style></head><body>
<script>
var q=new URLSearchParams(location.search);
var page=q.get('p')||'/';var scroll=Number(q.get('sc')||0);
var widths=(q.get('w')||'390,768').split(',');var height=q.get('h')||'1400';
widths.forEach(function(w){
  var fig=document.createElement('figure');
  var cap=document.createElement('figcaption');cap.textContent=w+' x '+height;
  var f=document.createElement('iframe');f.width=w;f.height=height;f.src=page;
  f.addEventListener('load',function(){
    var d=f.contentDocument;var s=d.createElement('style');
    s.textContent='html{scroll-behavior:auto !important}*{transition-duration:0s !important;animation-duration:0s !important}';
    d.head.appendChild(s);
    setTimeout(function(){
      f.contentWindow.scrollTo(0,scroll);
      d.querySelectorAll('[style]').forEach(function(n){
        if(n.style.opacity==='0'){n.style.opacity='';n.style.transform='';}
      });
    },700);
  });
  fig.appendChild(cap);fig.appendChild(f);document.body.appendChild(fig);
});
</script>
</body></html>
